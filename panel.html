/* Nouveau conteneur pour les rubriques en grille */
.rubriques-grid {
    display: grid;

/* Ajuster les rubriques dans la grille */

/* Supprimer l'ancien style victime-block */
.victime-block {

.btn-group .btn::after {

    height: 0;

    border-radius: 50%;

<script>

function validerVictime() {
  const prenom = document.getElementById('prenomVictime').value;
  const nom = document.getElementById('nomVictime').value;
  const identifiant = document.getElementById('identifiantVictime').value;
  const etablissement = document.getElementById('etablissementVictime').value;

  fetch('valider.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'prenom=' + encodeURIComponent(prenom) +
          '&nom=' + encodeURIComponent(nom) +
          '&identifiant=' + encodeURIComponent(identifiant) +
          '&etablissement=' + encodeURIComponent(etablissement)
  })
  .then(r => r.text())
  .then(t => {
    if (t === 'OK') alert('Enregistré !');
    else alert('Erreur : ' + t);
  });
}
</script>
